name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: agentscope-${{ matrix.os }}
          path: artifacts/*.vsix
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: agentscope-ubuntu-latest
          path: artifacts
      - name: Validate release package and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = json.loads(Path('package.json').read_text())['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit('Release tag must match the package version.')
          artifact = Path('artifacts') / f'agentscope-{version}.vsix'
          with zipfile.ZipFile(artifact) as archive:
              bundled = json.loads(archive.read('extension/package.json'))
              if bundled['version'] != version or archive.testzip() is not None:
                  raise SystemExit('The release package is invalid or has the wrong version.')
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(rf'^## {re.escape(version)}\s*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not section or not section.group(1).strip():
              raise SystemExit('Release notes are missing from CHANGELOG.md.')
          notes = section.group(1).strip() + '\n\n'
          notes += 'Download the VSIX below and install it using **Extensions: Install from VSIX** in VS Code.\n\n'
          notes += 'The test suite and package build passed on Windows, macOS and Linux.\n'
          Path('release-notes.md').write_text(notes)
          PY
      - name: Publish GitHub release and VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          artifact="artifacts/agentscope-${RELEASE_TAG#v}.vsix"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$artifact" --clobber
          else
            gh release create "$RELEASE_TAG" "$artifact" \
              --verify-tag --title "AgentScope ${RELEASE_TAG#v}" \
              --notes-file release-notes.md
          fi
