name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: agentscope-${{ matrix.os }}
          path: artifacts/*.vsix
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: agentscope-ubuntu-latest
          path: artifacts
      - name: Validate release package and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = json.loads(Path('package.json').read_text())['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit('Release tag must match the package version.')
          artifact = Path('artifacts') / f'agentscope-{version}.vsix'
          with zipfile.ZipFile(artifact) as archive:
              bundled = json.loads(archive.read('extension/package.json'))
              if bundled['version'] != version or archive.testzip() is not None:
                  raise SystemExit('The release package is invalid or has the wrong version.')
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(rf'^## {re.escape(version)}\s*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not section or not section.group(1).strip():
              raise SystemExit('Release notes are missing from CHANGELOG.md.')
          notes = section.group(1).strip() + '\n\n'
          notes += 'Download the VSIX below and install it using **Extensions: Install from VSIX** in VS Code.\n\n'
          notes += 'The test suite and package build passed on Windows, macOS and Linux.\n'
          Path('release-notes.md').write_text(notes)
          PY
      - name: Publish GitHub release and VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          artifact="artifacts/agentscope-${RELEASE_TAG#v}.vsix"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$artifact" --clobber
          else
            gh release create "$RELEASE_TAG" "$artifact" \
              --verify-tag --title "AgentScope ${RELEASE_TAG#v}" \
              --notes-file release-notes.md
          fi

  marketplace:
    name: Publish Marketplace
    if: >-
      github.repository == 'Super-Entity/AgentScope' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: marketplace-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: agentscope-ubuntu-latest
          path: artifacts
      - name: Validate package and select publisher authentication
        id: prepare
        env:
          MARKETPLACE_AUTH: ${{ vars.MARKETPLACE_AUTH }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          def fail(message):
              print(f'::error::{message}', flush=True)
              raise SystemExit(1)

          manifest = json.loads(Path('package.json').read_text())
          version = manifest['version']
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version):
              fail('Marketplace publishing requires a stable package version.')
          if (manifest['publisher'], manifest['name']) != ('SuperEntity', 'agentscope'):
              fail('Unexpected Marketplace publisher or extension name.')
          if os.environ.get('GITHUB_REF', '').startswith('refs/tags/') and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              fail('The release tag must match the package version.')
          artifact = Path('artifacts') / f'agentscope-{version}.vsix'
          with zipfile.ZipFile(artifact) as archive:
              bundled = json.loads(archive.read('extension/package.json'))
              if any(bundled[key] != manifest[key] for key in ('publisher', 'name', 'version')) or archive.testzip() is not None:
                  fail('The tested VSIX does not match this extension and version.')

          mode = os.environ.get('MARKETPLACE_AUTH', '').strip() or 'auto'
          client = bool(os.environ.get('AZURE_CLIENT_ID', '').strip())
          tenant = bool(os.environ.get('AZURE_TENANT_ID', '').strip())
          pat = bool(os.environ.get('VSCE_PAT', '').strip())
          if mode not in ('auto', 'azure', 'pat'):
              fail('MARKETPLACE_AUTH must be auto, azure, or pat.')
          if mode == 'auto':
              if client != tenant:
                  fail('Set both AZURE_CLIENT_ID and AZURE_TENANT_ID, or remove the incomplete Azure configuration.')
              mode = 'azure' if client and tenant else 'pat'
          if mode == 'azure' and not (client and tenant):
              fail('Azure publishing requires AZURE_CLIENT_ID and AZURE_TENANT_ID Actions variables.')
          if mode == 'pat' and not pat:
              fail('Marketplace publishing is not configured. Configure Microsoft Entra federation or the VSCE_PAT Actions secret in GitHub settings.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'auth={mode}\nartifact={artifact.as_posix()}\n')
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Publishing SuperEntity.agentscope {version} with {mode} authentication.\n\nVSIX SHA256: `{digest}`\n')
          PY
      - name: Sign in with Microsoft Entra federation
        if: steps.prepare.outputs.auth == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish tested VSIX with Microsoft Entra
        if: steps.prepare.outputs.auth == 'azure'
        env:
          VSIX_PATH: ${{ steps.prepare.outputs.artifact }}
          VSCE_PAT: ''
        run: npx --no-install vsce publish --packagePath "$VSIX_PATH" --skip-duplicate --azure-credential
      - name: Publish tested VSIX with publisher token
        if: steps.prepare.outputs.auth == 'pat'
        env:
          VSIX_PATH: ${{ steps.prepare.outputs.artifact }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath "$VSIX_PATH" --skip-duplicate
